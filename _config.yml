# site identity (also used for search results and link previews)
title: Gary Mooney
tagline: Quantum Computing Researcher
name: Gary Mooney
bio: Quantum computing research fellow at the University of Melbourne. I also make games and like to climb rocks.
description: Gary Mooney is a quantum computing research fellow at the University of Melbourne working on entanglement benchmarking, quantum circuit compilation and quantum optimisation. He also makes games.
lang: en_AU

# profile picture; better with square images
external-image: false
picture: assets/images/gary-dp.webp

# image shown when links to the site are shared (must be JPG/PNG for LinkedIn etc.)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/share-card.jpg
  - scope:
      path: ""
      layout: "post"
    values:
      hidden: false
      author: garymooney

# search engine ownership verification (jekyll-seo-tag adds the meta tags)
webmaster_verifications:
  google: hVkuBVrpQY11USu2G6QO4pDwVkO-usbcxGYnURt_L50

# structured data for search engines (jekyll-seo-tag)
social:
  name: Gary Mooney
  links:
    - https://github.com/garymooney
    - https://scholar.google.com/citations?user=s2VFDloAAAAJ
    - https://www.linkedin.com/in/gary-mooney-346687b0
    - https://www.instagram.com/_garymooney

# If you want to include your resume, set to true
# and specify source (external or local).
resume: false
resume-external: true
resume-url: # link to a CV here if you ever want the nav item

url: https://garymooney.github.io

permalink: /:title/

# social links shown under your name (comment a line out to hide it)
instagram: _garymooney
linkedin: gary-mooney-346687b0/
github: garymooney
google-scholar: s2VFDloAAAAJ
email: gary.mooney4444@gmail.com

authors:
  garymooney:
    name: Gary Mooney
    bio: Quantum computing research fellow at the University of Melbourne. I also make games and like to climb rocks.
    external-image: false
    picture: assets/images/gary-dp.webp

# options: [normal, large] | normal = 560px / large = 810px
width: large

# which pages appear in the nav
projects: true
about: true
research: true

# post page options
read-time: false
show-tags: false
related: false
show-author: true
post-advance-links: []

# fade-in animation on the home header
animation: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

compress_html:
  ignore:
    envs:
      - development
      - stage

exclude:
  [
    "README.md",
    "Gemfile",
    "Gemfile.lock",
    "FAQ.md",
    "Rakefile",
    "vendor",
    "*.pdf",
  ]
